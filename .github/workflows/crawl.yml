name: Weekly ads.txt crawl

on:
  schedule:
    - cron: "0 20 * * 0"   # Sundays 20:00 UTC (22:00 Berlin in summer, 21:00 in winter)
  workflow_dispatch:        # the "Run workflow" button

permissions:
  contents: write           # lets the run save its results back into this repository

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Self-test (the crawl does not run if this fails)
        run: python -m unittest -v test_crawler
      - name: Crawl
        run: python crawler.py
      - name: Save results
        run: |
          git config user.name "adstxt-watch"
          git config user.email "adstxt-watch@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save"
          else
            git commit -m "Crawl $(date -u +%F)"
            git push
          fi
